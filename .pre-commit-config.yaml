# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
ci:
  # pre-commit.ci cannot run language: system hooks (no uv available there);
  # the docs job in package_quality.yml covers the strict docs build in CI
  skip: [docs-build]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-ast
      - id: check-symlinks
      - id: debug-statements
      - id: trailing-whitespace
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff
        args: [ --fix ]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.0
    hooks:
    -   id: mypy
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.21.2
    hooks:
    -   id: pyupgrade
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.25
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]"]
  - repo: local
    hooks:
      - id: docs-build
        name: Build docs (strict, warnings as errors)
        entry: uv run --group docs sphinx-build -W --keep-going -b html docs docs/_build/html
        language: system
        pass_filenames: false
        files: ^(docs/|temporal_adjuster/|pyproject\.toml)
