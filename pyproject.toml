[build-system]
requires = ["uv_build>=0.11,<0.13"]
build-backend = "uv_build"

[project]
name = "temporal_adjuster"
version = "1.2.0"
description = "Adjusters are a key tool for modifying temporal objects. They exist to externalize the process of adjustment, permitting different approaches, as per the strategy design pattern. Temporal Adjuster provides tools that help pinpoint very specific moments in time, without having to manually count days, weeks, or months."
# typing.Self in common/types requires 3.11+
requires-python = ">=3.11"
authors = [
  {name = "Gabriel Mitelman Tkacz", email = "gmtkacz@proton.me"},
]
maintainers = [
  {name = "Gabriel Mitelman Tkacz", email = "gmtkacz@proton.me"},
]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
keywords = ["date", "time", "datetime", "adjuster", "adjustment", "temporal"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/gtkacz/temporal_adjusters_py.git"
Issues = "https://github.com/gtkacz/temporal_adjusters_py/issues"
Documentation = "https://temporal-adjusters-py.readthedocs.io"

[dependency-groups]
dev = [
  {include-group = "docs"},
  {include-group = "test"},
  "mypy>=1.15",
  "pre-commit>=4",
  "ruff>=0.11",
]
test = [
  "coverage>=7",
]
docs = [
  "sphinx>=8",
  "sphinx-autodoc-typehints>=3",
  "sphinx-docsearch>=0.1",
  "sphinxawesome-theme>=5",
]

# The package ships a flat layout rather than src/
[tool.uv.build-backend]
module-root = ""
