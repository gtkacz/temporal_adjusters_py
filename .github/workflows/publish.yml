name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/temporal-adjuster/
    permissions:
      # Required for PyPI trusted publishing (OIDC)
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0

      - name: Build package
        run: uv build

      - name: Publish package to PyPI
        run: uv publish --trusted-publishing always
